<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerala Labour Connect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7f5;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding-bottom: 75px;
    }

    header {
      background: #16823b;
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
    }

    .content {
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 15px;
      outline: none;
    }

    .search:focus {
      border-color: #16823b;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category {
      border: 1px solid #e1e1e1;
      border-radius: 15px;
      padding: 20px 10px;
      text-align: center;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: 0.15s;
      user-select: none;
    }

    .category:active {
      transform: scale(0.96);
      background: #eaf7ee;
    }

    .category .icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .category strong {
      display: block;
      font-size: 15px;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      background: #eaf7ee;
      border-radius: 12px;
      color: #16823b;
      font-weight: bold;
      display: none;
      text-align: center;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
      z-index: 100;
    }

    .bottom button {
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      color: #333;
      padding: 3px 12px;
    }

    .bottom button.active {
      color: #16823b;
      font-weight: bold;
    }

    .bottom span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Kerala Labour Connect</h1>
    <p>Find trusted local workers near you</p>
  </header>

  <div class="content">

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="Search workers or work..."
    >

    <h2>Work Categories</h2>

    <div class="categories">

      <button class="category" onclick="selectCategory('Rajmistri')">
        <div class="icon">👷</div>
        <strong>Rajmistri</strong>
      </button>

      <button class="category" onclick="selectCategory('Labour')">
        <div class="icon">🧑‍🔧</div>
        <strong>Labour</strong>
      </button>

      <button class="category" onclick="selectCategory('Electrician')">
        <div class="icon">⚡</div>
        <strong>Electrician</strong>
      </button>

      <button class="category" onclick="selectCategory('Plumber')">
        <div class="icon">🔧</div>
        <strong>Plumber</strong>
      </button>

      <button class="category" onclick="selectCategory('Carpenter')">
        <div class="icon">🪚</div>
        <strong>Carpenter</strong>
      </button>

      <button class="category" onclick="selectCategory('Painter')">
        <div class="icon">🎨</div>
        <strong>Painter</strong>
      </button>

    </div>

    <div id="message" class="message"></div>

  </div>

  <nav class="bottom">

    <button class="active" onclick="showHome()">
      <span>🏠</span>
      Home
    </button>

    <button onclick="showSearch()">
      <span>🔎</span>
      Search
    </button>

    <button onclick="showRequests()">
      <span>📋</span>
      Requests
    </button>

    <button onclick="showProfile()">
      <span>👤</span>
      Profile
    </button>

  </nav>

</div>

<script>

  function selectCategory(category) {
    const message = document.getElementById("message");

    message.style.display = "block";
    message.innerText = "Searching for " + category + " workers...";

    setTimeout(function() {
      message.innerText = category + " workers will appear here.";
    }, 800);
  }

  function showHome() {
    setActiveButton(0);
    document.querySelector("h2").innerText = "Work Categories";
    document.getElementById("message").style.display = "none";
    window.scrollTo(0, 0);
  }

  function showSearch() {
    setActiveButton(1);

    const search = document.getElementById("searchInput");
    search.focus();

    document.getElementById("message").style.display = "block";
    document.getElementById("message").innerText =
      "Search for a worker or type of work above.";
  }

  function showRequests() {
    setActiveButton(2);

    const message = document.getElementById("message");
    message.style.display = "block";
    message.innerText = "No requests yet.";
  }

  function showProfile() {
    setActiveButton(3);

    const message = document.getElementById("message");
    message.style.display = "block";
    message.innerText = "Worker Profile section will open here.";
  }

  function setActiveButton(index) {
    const buttons = document.querySelectorAll(".bottom button");

    buttons.forEach(function(button) {
      button.classList.remove("active");
    });

    buttons[index].classList.add("active");
  }

  document.getElementById("searchInput").addEventListener("input", function() {

    const value = this.value.toLowerCase().trim();
    const categories = document.querySelectorAll(".category");

    categories.forEach(function(category) {

      const name = category.innerText.toLowerCase();

      if (name.includes(value)) {
        category.style.display = "";
      } else {
        category.style.display = "none";
      }

    });

  });

</script>

</body>
</html>
